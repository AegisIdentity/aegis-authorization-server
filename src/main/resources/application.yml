server:
  port: 9000
  servlet:
    kafka:
    # The AS both PUBLISHES (audit + tenant-key-provisioning events) and CONSUMES (tenant lifecycle
    # -> eager key provisioning). Off unless a broker is configured, so unit tests boot without Kafka.
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  session:
      cookie:
        # L-core-2: the AS is the stateful login host — harden its session cookie.
        # HttpOnly + SameSite are always safe; Secure is forced on by default and relaxed only under
        # the dev profile (see application-dev.yml) where login runs over plain http://localhost.
        http-only: true
        same-site: lax
        secure: true

spring:
  application:
    name: aegis-authorization-server
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/aegis_authz}
    username: ${POSTGRES_USER:aegis}
    # M-core-6: no inline secret default — startup fails fast if POSTGRES_PASSWORD is unset outside the
    # dev profile (the dev profile supplies a dev-only fallback in application-dev.yml).
    password: ${POSTGRES_PASSWORD}
  sql:
    init:
      mode: always
      # Postgres-adapted copies of the schemas shipped in the Authorization Server jar (the shipped
      # ones use H2/MySQL 'blob'; Postgres needs 'bytea'). Structure is otherwise unchanged — see
      # db/postgresql/README for how they are derived.
      schema-locations:
        - classpath:db/postgresql/oauth2-authorization-schema.sql
        - classpath:db/postgresql/oauth2-authorization-consent-schema.sql
        - classpath:db/postgresql/oauth2-registered-client-schema.sql
        # Aegis-owned (not Spring-shipped): durable per-tenant signing keys, so keys survive a
        # restart and every replica signs with the same key per tenant.
        - classpath:db/postgresql/tenant-signing-key-schema.sql
      continue-on-error: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  session:
    # The AS is the platform's one stateful service (interactive login). A process-local session is
    # incompatible with the Helm chart's replicaCount 2 / HPA-to-8 behind an affinity-free Service:
    # a login begun on one pod breaks on the next request.
    #
    # Storage is Redis, selected by CLASSPATH AUTO-DETECTION (spring-session-data-redis +
    # spring-boot-session). Boot 4 removed `spring.session.store-type`, so there is no property to
    # switch stores with — the service therefore REQUIRES a reachable Redis, which is the honest
    # posture for a service that cannot be correct without one. Point it at Redis via
    # SPRING_DATA_REDIS_HOST / _PORT / _PASSWORD.
    timeout: 30m

aegis:
  # --- Vault-backed token signing (ADR-0015, migration per VAULT-ARCHITECTURE.md §7) ------------
  # Default OFF: the cutover is rotation-based and reversible. Enabling publishes the Vault kid into
  # JWKS and switches signing onto Transit, where the private key never enters this process. The old
  # KMS kid stays published and verifiable until every token it signed has expired.
  vault:
    enabled: ${AEGIS_VAULT_ENABLED:false}
    uri: ${AEGIS_VAULT_URI:http://localhost:8200}
    isolation: ${AEGIS_VAULT_ISOLATION:PATH}
    mount: ${AEGIS_VAULT_MOUNT:aegis}
    token: ${AEGIS_VAULT_TOKEN:}
    signing:
      enabled: ${AEGIS_VAULT_SIGNING_ENABLED:false}
    transit:
      token-signing-key: ${AEGIS_VAULT_TOKEN_SIGNING_KEY:token-signing}
  # --- MCP Enterprise-Managed Authorization: ID-JAG redemption (ADR-0012) ----------------------
  # OFF until an operator names the issuers allowed to mint assertions for this server's resources.
  # An empty allow-list trusts nothing, so enabling without configuring simply rejects everything —
  # which is the correct failure direction.
  idjag:
    enabled: ${AEGIS_IDJAG_ENABLED:false}
    trusted-issuers: ${AEGIS_IDJAG_TRUSTED_ISSUERS:}
  # In-network issuer stamped on the AS's own service tokens (IdentityClient etc.).
  issuer: ${AEGIS_ISSUER:http://localhost:9000}
  # Public base URL apps use to reach the platform — the edge gateway in a real deployment.
  # Tenant-app tokens (interaction-code exchange) carry `iss = <public-issuer-base>/<tenant>`,
  # so a tenant's own backend can validate them via standard OIDC discovery through the gateway.
  public-issuer-base: ${AEGIS_PUBLIC_ISSUER_BASE:http://localhost:9000}
  # Login delegates credential verification to identity-service (the credential store).
  identity-service:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:9102}
  # Federated login resolves per-tenant provider config from the social-broker.
  social-broker:
    base-url: ${SOCIAL_BROKER_URL:http://localhost:9105}
  # Step-up MFA (enrolment check + TOTP validate/enrol) is driven against the mfa-webauthn-service.
  mfa-service:
    base-url: ${MFA_SERVICE_URL:http://localhost:9103}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: INFO
