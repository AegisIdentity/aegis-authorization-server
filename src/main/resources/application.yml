server:
  port: 9000
  servlet:
    session:
      cookie:
        # L-core-2: the AS is the stateful login host — harden its session cookie.
        # HttpOnly + SameSite are always safe; Secure is forced on by default and relaxed only under
        # the dev profile (see application-dev.yml) where login runs over plain http://localhost.
        http-only: true
        same-site: lax
        secure: true

spring:
  application:
    name: aegis-authorization-server
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/aegis_authz}
    username: ${POSTGRES_USER:aegis}
    # M-core-6: no inline secret default — startup fails fast if POSTGRES_PASSWORD is unset outside the
    # dev profile (the dev profile supplies a dev-only fallback in application-dev.yml).
    password: ${POSTGRES_PASSWORD}
  sql:
    init:
      mode: always
      # Postgres-adapted copies of the schemas shipped in the Authorization Server jar (the shipped
      # ones use H2/MySQL 'blob'; Postgres needs 'bytea'). Structure is otherwise unchanged — see
      # db/postgresql/README for how they are derived.
      schema-locations:
        - classpath:db/postgresql/oauth2-authorization-schema.sql
        - classpath:db/postgresql/oauth2-authorization-consent-schema.sql
        - classpath:db/postgresql/oauth2-registered-client-schema.sql
      continue-on-error: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

aegis:
  # In-network issuer stamped on the AS's own service tokens (IdentityClient etc.).
  issuer: ${AEGIS_ISSUER:http://localhost:9000}
  # Public base URL apps use to reach the platform — the edge gateway in a real deployment.
  # Tenant-app tokens (interaction-code exchange) carry `iss = <public-issuer-base>/<tenant>`,
  # so a tenant's own backend can validate them via standard OIDC discovery through the gateway.
  public-issuer-base: ${AEGIS_PUBLIC_ISSUER_BASE:http://localhost:9000}
  # Login delegates credential verification to identity-service (the credential store).
  identity-service:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:9102}
  # Federated login resolves per-tenant provider config from the social-broker.
  social-broker:
    base-url: ${SOCIAL_BROKER_URL:http://localhost:9105}
  # Step-up MFA (enrolment check + TOTP validate/enrol) is driven against the mfa-webauthn-service.
  mfa-service:
    base-url: ${MFA_SERVICE_URL:http://localhost:9103}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: INFO
